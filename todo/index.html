<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<link rel="shortcut icon" type="image/x-icon" href="../favicon.ico" />
<title>Todo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  :root { --content-font-size: 18px; }
  body, html {
    margin: 0; padding: 0; height: 100%;
    background: #f2f0ef;
    font-family: 'Fira Code', monospace;
    color: #222;
    display: flex;
    flex-direction: column;
    height: 100vh;
    user-select: text;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  #toolbar {
    background-color: #ffffffdd;
    border-bottom: 1px solid #ccc;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: saturate(180%) blur(8px);
    transition: background-color 0.3s ease, border-color 0.3s ease;
    flex-wrap: wrap;
    justify-content: space-between;
  }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sep { border-left: 1px solid #ccc; height: 20px; margin: 0 6px; }
  button {
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px 8px;
    font-size: 16px;
    border-radius: 4px;
    transition: background-color 0.15s ease, color 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
    font-family: inherit;
  }
  button:hover { background-color: #e0e0e0; }
  button svg { width: 18px; height: 18px; fill: currentColor; }
  #decreaseFontBtn, #increaseFontBtn { font-family: Arial, sans-serif; line-height: 1; user-select: none; }
  #decreaseFontBtn { font-weight: 100; font-size: 18px; }
  #increaseFontBtn { font-weight: 900; font-size: 24px; }

  #listBar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 8px 20px;
    border-bottom: 1px solid #ccc;
    transition: border-color 0.3s ease;
  }
  #listSelect {
    font-family: inherit;
    font-size: 15px;
    padding: 5px 8px;
    border-radius: 4px;
    border: 1px solid #ccc;
    background: #fff;
    color: inherit;
    max-width: 60vw;
  }
  #listBar button svg { width: 16px; height: 16px; }

  #newTaskForm { display: flex; gap: 8px; padding: 10px 20px; }
  #newTaskInput {
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: var(--content-font-size);
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
    color: inherit;
  }
  #newTaskForm button[type="submit"] { flex-shrink: 0; }

  #taskList {
    flex: 1;
    overflow-y: auto;
    margin: 0;
    padding: 6px 20px 40px;
    list-style: none;
    font-size: var(--content-font-size);
  }
  .task-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 2px;
    border-bottom: 1px solid #e6e6e6;
  }
  .task-item:last-child { border-bottom: none; }
  .task-checkbox { width: 19px; height: 19px; flex-shrink: 0; cursor: pointer; accent-color: #333; }
  .task-text {
    flex: 1;
    min-width: 0;
    word-break: break-word;
    padding: 4px 6px;
    border-radius: 3px;
    cursor: text;
  }
  .task-text:hover, .task-text:focus { background: rgba(0,0,0,0.05); outline: none; }
  .task-item.done .task-text { text-decoration: line-through; opacity: 0.5; }
  .task-edit-input {
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: var(--content-font-size);
    padding: 4px 6px;
    border: 1px solid #999;
    border-radius: 3px;
    background: #fff;
    color: inherit;
  }
  .task-delete { flex-shrink: 0; font-size: 20px; line-height: 1; color: #999; }
  .task-delete:hover { color: #c00; background: #f0e0e0; }

  #emptyState { flex: 1; padding: 40px 20px; text-align: center; opacity: 0.5; font-size: 15px; }

  .monospace-mode #taskList, .monospace-mode #newTaskInput,
  .monospace-mode .task-edit-input, .monospace-mode #listSelect {
    font-family: 'monospace', Consolas, Courier New, Monaco, sans-serif;
    font-weight: 800;
  }

  body.dark-mode { background-color: #000000; color: #ffff8c; }
  body.dark-mode #toolbar { background-color: #000000; border-bottom-color: #ffff8c; backdrop-filter: none; }
  body.dark-mode .sep { border-left-color: #444; }
  body.dark-mode button { color: #ffff8c; }
  body.dark-mode button:hover { background-color: rgba(255,255,140,0.12); }
  body.dark-mode #listBar { border-bottom-color: #444; }
  body.dark-mode #listSelect, body.dark-mode #newTaskInput, body.dark-mode .task-edit-input {
    background: #000; color: #ffff8c; border-color: #444;
  }
  body.dark-mode .task-item { border-bottom-color: #1a1a1a; }
  body.dark-mode .task-checkbox { accent-color: #ffff8c; }
  body.dark-mode .task-text:hover, body.dark-mode .task-text:focus { background: rgba(255,255,140,0.1); }
  body.dark-mode .task-delete { color: #887; }
  body.dark-mode .task-delete:hover { color: #ff8080; background: rgba(255,128,128,0.15); }

  #status { font-size: 13px; display: flex; align-items: center; gap: 6px; padding: 0 4px; }
  #statusDot { width: 9px; height: 9px; border-radius: 50%; background: #999; flex-shrink: 0; }
  #status.synced #statusDot { background: #2ea640; }
  #status.pending #statusDot, #status.saving #statusDot { background: #e0a020; }
  #status.error #statusDot { background: #d02020; }
  #status.offline #statusDot { background: #999; }

  .modal, .backdrop {
    position: fixed; z-index: 1000;
  }
  .backdrop { top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; }
  .modal {
    display: none;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: #f9f9f9; border: 1px solid #ccc; padding: 20px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.15); z-index: 1001;
    min-width: 280px; max-width: 90vw;
  }
  .modal h3 { margin-top: 0; }
  .modal input[type="password"], .modal input[type="text"] {
    width: 100%; padding: 6px; margin: 6px 0 10px; font-family: inherit;
  }
  .modal .row { display: flex; justify-content: flex-end; gap: 10px; }
  .modal p.hint { font-size: 12px; color: #666; margin: 4px 0 0; }
  .modal p.error { font-size: 12px; color: #b00; margin: 4px 0 0; }
  body.dark-mode .modal { background: #111; border-color: #ffff8c; color: #ffff8c; }
  body.dark-mode .modal p.hint { color: #ccc; }

  @media (max-width: 720px) {
    #toolbar { padding: 4px 8px; gap: 5px; font-size: 14px; }
    button { padding: 5px 6px; font-size: 14px; }
    #listBar, #newTaskForm, #taskList { padding-left: 10px; padding-right: 10px; }
    #listSelect { max-width: 50vw; font-size: 13px; }
    #status span.label { display: none; }
  }
</style>
</head>
<body>

  <div class="backdrop" id="modalBackdrop"></div>

  <div class="modal" id="settingsModal">
    <h3>Synchronisation GitHub</h3>
    <label for="tokenInput">Token GitHub (scope <code>gist</code> uniquement)</label>
    <input type="password" id="tokenInput" placeholder="ghp_..." autocomplete="off" />
    <p class="hint" id="gistLink"></p>
    <p class="error" id="settingsError" style="display:none"></p>
    <div class="row">
      <button type="button" id="tokenClearBtn">Déconnecter</button>
      <button type="button" id="tokenSaveBtn">Connecter</button>
      <button type="button" id="settingsCloseBtn">Fermer</button>
    </div>
  </div>

  <div id="toolbar" role="toolbar" aria-label="Barre d'outils">
    <div class="group">
      <button type="button" id="clearBtn" title="Vider la liste courante" aria-label="Vider la liste courante">
        <svg viewBox="0 0 24 24"><path d="M3 3h18v2H3V3zm0 16h18v2H3v-2zm5-9h8v2H8v-2z"/></svg>
      </button>
      <button type="button" id="openBtn" title="Importer un .txt" aria-label="Importer">
        <svg viewBox="0 0 24 24"><path d="M20 6v12H4V6h16m0-2H4c-1.1 0-2 .9-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6c0-1.1-.9-2-2-2zM8 12l4-4 4 4H8z"/></svg>
      </button>
      <button type="button" id="exportBtn" title="Exporter en .txt" aria-label="Exporter">
        <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v14a2 2 0 002 2h10c1.1 0 2-.9 2-2V7l-4-4zM7 19V5h8v4h-3v6H7z"/></svg>
      </button>
      <div class="sep"></div>
      <button type="button" id="decreaseFontBtn" title="Réduire la police">A</button>
      <button type="button" id="increaseFontBtn" title="Agrandir la police">A</button>
      <div class="sep"></div>
      <button type="button" id="fontSpaceBtn" title="Police proportionnelle / à chasse fixe" style="font-weight:bold;font-size:20px;">P/M</button>
      <div class="sep"></div>
      <button type="button" id="darkModeToggle" title="Mode sombre">
        <svg viewBox="0 0 24 24"><path d="M 12,0 A 8 8 0 1 0 12, 24 A 14 14 0 0 1 12, 0"/></svg>
      </button>
    </div>
    <div class="group">
      <div id="status" class="offline"><span id="statusDot"></span><span class="label" id="statusLabel">hors ligne</span></div>
      <button type="button" id="reloadBtn" title="Recharger depuis le gist" aria-label="Recharger">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08a6 6 0 11-1.38-6.36L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
      <button type="button" id="settingsBtn" title="Connexion GitHub" aria-label="Réglages de synchronisation">
        <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1112 8.5a3.5 3.5 0 010 7zm7.43-2.5c0-.32-.03-.63-.07-.94l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.6-.22l-2.39.96a7.3 7.3 0 00-1.62-.94l-.36-2.54a.5.5 0 00-.5-.42h-3.84a.5.5 0 00-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 00-.6.22L2.9 9.84a.5.5 0 00.12.64l2.03 1.58c-.04.31-.07.62-.07.94s.03.63.07.94l-2.03 1.58a.5.5 0 00-.12.64l1.92 3.32c.14.24.42.32.6.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.23.1.51.02.6-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58c.04-.31.07-.62.07-.94z"/></svg>
      </button>
    </div>
  </div>

  <div id="listBar" role="toolbar" aria-label="Gestion des listes">
    <select id="listSelect" aria-label="Liste courante"></select>
    <button type="button" id="addListBtn" title="Nouvelle liste" aria-label="Nouvelle liste">
      <svg viewBox="0 0 24 24"><path d="M19 13H13V19H11V13H5V11H11V5H13V11H19V13Z"/></svg>
    </button>
    <button type="button" id="renameListBtn" title="Renommer la liste" aria-label="Renommer la liste">
      <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1.003 1.003 0 000-1.42l-2.34-2.34a1.003 1.003 0 00-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.82z"/></svg>
    </button>
    <button type="button" id="deleteListBtn" title="Supprimer la liste" aria-label="Supprimer la liste">
      <svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
    </button>
  </div>

  <form id="newTaskForm" autocomplete="off">
    <input type="text" id="newTaskInput" placeholder="Nouvelle tâche…" aria-label="Nouvelle tâche" />
    <button type="submit" title="Ajouter" aria-label="Ajouter la tâche">
      <svg viewBox="0 0 24 24"><path d="M19 13H13V19H11V13H5V11H11V5H13V11H19V13Z"/></svg>
    </button>
  </form>

  <ul id="taskList" aria-label="Tâches"></ul>
  <p id="emptyState" hidden>Aucune tâche pour l'instant.</p>

  <input type="file" id="fileInput" accept=".txt" style="display:none" />

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const GIST_MARKER = 'outerovitch-todo-store-v1';
    const GIST_FILENAME = 'todo.txt';
    const LS_TOKEN = 'todoGhToken';
    const LS_GIST_ID = 'todoGistId';
    const LS_CACHE = 'todoLocalCache';
    const LS_DARK = 'todoDarkMode';
    const LS_MONO = 'todoMonospace';
    const LS_LAST_LIST = 'todoLastList';
    const DEBOUNCE_MS = 2500;

    const listSelect = document.getElementById('listSelect');
    const addListBtn = document.getElementById('addListBtn');
    const renameListBtn = document.getElementById('renameListBtn');
    const deleteListBtn = document.getElementById('deleteListBtn');
    const newTaskForm = document.getElementById('newTaskForm');
    const newTaskInput = document.getElementById('newTaskInput');
    const taskListEl = document.getElementById('taskList');
    const emptyStateEl = document.getElementById('emptyState');
    const clearBtn = document.getElementById('clearBtn');
    const openBtn = document.getElementById('openBtn');
    const exportBtn = document.getElementById('exportBtn');
    const fileInput = document.getElementById('fileInput');
    const decreaseFontBtn = document.getElementById('decreaseFontBtn');
    const increaseFontBtn = document.getElementById('increaseFontBtn');
    const fontSpaceBtn = document.getElementById('fontSpaceBtn');
    const darkModeToggle = document.getElementById('darkModeToggle');
    const reloadBtn = document.getElementById('reloadBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const settingsCloseBtn = document.getElementById('settingsCloseBtn');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const tokenInput = document.getElementById('tokenInput');
    const tokenSaveBtn = document.getElementById('tokenSaveBtn');
    const tokenClearBtn = document.getElementById('tokenClearBtn');
    const gistLink = document.getElementById('gistLink');
    const settingsError = document.getElementById('settingsError');
    const statusEl = document.getElementById('status');
    const statusLabel = document.getElementById('statusLabel');

    let ghToken = localStorage.getItem(LS_TOKEN) || '';

    /* ---------- modèle de données : plusieurs listes, sérialisation façon org-mode ---------- */
    let state = { lists: [], currentListId: null };
    let uidCounter = 0;
    function genId() { uidCounter++; return 'id' + uidCounter + Math.random().toString(36).slice(2, 8); }

    function sanitizeInlineText(v) { return (v || '').replace(/[\r\n]+/g, ' ').trim(); }

    function sortTasks(list) { list.tasks.sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0)); }

    function parseSerialized(text) {
      const lists = [];
      let current = null;
      const lines = (text || '').split(/\r\n|\r|\n/);
      for (const rawLine of lines) {
        const line = rawLine.trimEnd();
        const listMatch = /^\*\s+(.*)$/.exec(line);
        if (listMatch) {
          current = { id: genId(), name: sanitizeInlineText(listMatch[1]) || 'Sans titre', tasks: [] };
          lists.push(current);
          continue;
        }
        const taskMatch = /^-\s*\[([ xX])\]\s*(.*)$/.exec(line);
        if (taskMatch) {
          if (!current) {
            current = { id: genId(), name: 'Sans titre', tasks: [] };
            lists.push(current);
          }
          current.tasks.push({ id: genId(), text: sanitizeInlineText(taskMatch[2]), done: taskMatch[1].toLowerCase() === 'x' });
        }
        // toute autre ligne (vide, mal formée) est ignorée silencieusement
      }
      lists.forEach(sortTasks);
      return lists;
    }

    function serializeLists(lists) {
      return lists.map(list => {
        const header = '* ' + (list.name || 'Sans titre');
        const tasks = list.tasks.map(t => '- [' + (t.done ? 'X' : ' ') + '] ' + t.text).join('\n');
        return tasks ? header + '\n' + tasks : header;
      }).join('\n\n') + '\n';
    }

    function ensureAtLeastOneList() {
      if (state.lists.length === 0) {
        state.lists.push({ id: genId(), name: 'Sans titre', tasks: [] });
      }
      if (!state.lists.find(l => l.id === state.currentListId)) {
        state.currentListId = state.lists[0].id;
      }
    }

    function getCurrentList() { return state.lists.find(l => l.id === state.currentListId); }

    function loadStateFromText(text) {
      state.lists = parseSerialized(text);
      const lastName = localStorage.getItem(LS_LAST_LIST);
      const match = lastName ? state.lists.find(l => l.name === lastName) : null;
      state.currentListId = match ? match.id : (state.lists[0] ? state.lists[0].id : null);
      ensureAtLeastOneList();
    }

    /* ---------- rendu ---------- */
    function renderListSelect() {
      listSelect.innerHTML = '';
      state.lists.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.id;
        const open = l.tasks.filter(t => !t.done).length;
        opt.textContent = l.name + (open ? ' (' + open + ')' : '');
        if (l.id === state.currentListId) opt.selected = true;
        listSelect.appendChild(opt);
      });
    }

    function buildTaskRow(task) {
      const li = document.createElement('li');
      li.className = 'task-item' + (task.done ? ' done' : '');
      li.dataset.id = task.id;

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'task-checkbox';
      checkbox.checked = task.done;
      checkbox.setAttribute('aria-label', task.done ? 'Marquer comme à faire' : 'Marquer comme fait');
      checkbox.addEventListener('change', () => toggleTask(task.id));

      const textSpan = document.createElement('span');
      textSpan.className = 'task-text';
      textSpan.textContent = task.text;
      textSpan.tabIndex = 0;
      textSpan.setAttribute('role', 'button');
      textSpan.title = 'Cliquer pour modifier';
      const startEdit = () => editTaskInline(task.id, li);
      textSpan.addEventListener('click', startEdit);
      textSpan.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); startEdit(); } });

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'task-delete';
      delBtn.setAttribute('aria-label', 'Supprimer la tâche');
      delBtn.title = 'Supprimer';
      delBtn.textContent = '×';
      delBtn.addEventListener('click', () => deleteTask(task.id));

      li.appendChild(checkbox);
      li.appendChild(textSpan);
      li.appendChild(delBtn);
      return li;
    }

    function editTaskInline(taskId, li) {
      const list = getCurrentList();
      const task = list && list.tasks.find(t => t.id === taskId);
      if (!task) return;
      const textSpan = li.querySelector('.task-text');
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'task-edit-input';
      input.value = task.text;
      li.replaceChild(input, textSpan);
      input.focus();
      input.select();

      let done = false;
      function commit() {
        if (done) return;
        done = true;
        const val = sanitizeInlineText(input.value);
        if (val) task.text = val;
        mutateState();
      }
      function cancel() {
        if (done) return;
        done = true;
        render();
      }
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); commit(); }
        else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
      });
      input.addEventListener('blur', commit);
    }

    function renderTaskList() {
      const list = getCurrentList();
      taskListEl.innerHTML = '';
      if (!list || list.tasks.length === 0) {
        taskListEl.hidden = true;
        emptyStateEl.hidden = false;
        return;
      }
      taskListEl.hidden = false;
      emptyStateEl.hidden = true;
      list.tasks.forEach(task => taskListEl.appendChild(buildTaskRow(task)));
    }

    function render() {
      const active = document.activeElement;
      let restoreId = null;
      if (active && active.classList && active.classList.contains('task-checkbox')) {
        const li = active.closest('li[data-id]');
        if (li) restoreId = li.dataset.id;
      }
      renderListSelect();
      renderTaskList();
      if (restoreId) {
        const li = taskListEl.querySelector('li[data-id="' + restoreId + '"]');
        const cb = li && li.querySelector('.task-checkbox');
        if (cb) cb.focus();
      }
    }

    /* ---------- mutations ---------- */
    function mutateState() {
      localStorage.setItem(LS_CACHE, serializeLists(state.lists));
      const current = getCurrentList();
      if (current) localStorage.setItem(LS_LAST_LIST, current.name);
      markDirty();
      render();
    }

    function toggleTask(id) {
      const list = getCurrentList();
      const task = list && list.tasks.find(t => t.id === id);
      if (!task) return;
      task.done = !task.done;
      sortTasks(list);
      mutateState();
    }

    function addTask(rawText) {
      const text = sanitizeInlineText(rawText);
      if (!text) return;
      const list = getCurrentList();
      if (!list) return;
      list.tasks.unshift({ id: genId(), text, done: false });
      sortTasks(list);
      mutateState();
    }

    function deleteTask(id) {
      const list = getCurrentList();
      if (!list) return;
      list.tasks = list.tasks.filter(t => t.id !== id);
      mutateState();
    }

    function addList() {
      const name = prompt('Nom de la nouvelle liste :');
      if (name === null) return;
      const trimmed = sanitizeInlineText(name);
      if (!trimmed) return;
      const list = { id: genId(), name: trimmed, tasks: [] };
      state.lists.push(list);
      state.currentListId = list.id;
      mutateState();
    }

    function renameCurrentList() {
      const list = getCurrentList();
      if (!list) return;
      const name = prompt('Renommer la liste :', list.name);
      if (name === null) return;
      const trimmed = sanitizeInlineText(name);
      if (!trimmed) return;
      list.name = trimmed;
      mutateState();
    }

    function deleteCurrentList() {
      const list = getCurrentList();
      if (!list) return;
      if (!confirm('Supprimer la liste « ' + list.name + ' » et toutes ses tâches ?')) return;
      state.lists = state.lists.filter(l => l.id !== list.id);
      ensureAtLeastOneList();
      mutateState();
    }

    listSelect.addEventListener('change', () => {
      const list = state.lists.find(l => l.id === listSelect.value);
      if (!list) return;
      state.currentListId = list.id;
      localStorage.setItem(LS_LAST_LIST, list.name);
      render();
    });
    addListBtn.addEventListener('click', addList);
    renameListBtn.addEventListener('click', renameCurrentList);
    deleteListBtn.addEventListener('click', deleteCurrentList);

    newTaskForm.addEventListener('submit', e => {
      e.preventDefault();
      addTask(newTaskInput.value);
      newTaskInput.value = '';
      newTaskInput.focus();
    });

    /* ---------- préférences d'affichage ---------- */
    let isMonospace = localStorage.getItem(LS_MONO) === 'true';
    if (isMonospace) {
      document.body.classList.add('monospace-mode');
      fontSpaceBtn.textContent = 'M/P';
    } else {
      fontSpaceBtn.textContent = 'P/M';
    }
    fontSpaceBtn.addEventListener('click', () => {
      isMonospace = !isMonospace;
      document.body.classList.toggle('monospace-mode', isMonospace);
      fontSpaceBtn.textContent = isMonospace ? 'M/P' : 'P/M';
      localStorage.setItem(LS_MONO, isMonospace);
    });

    let currentFontSize = 18;
    function updateFontSize() { document.documentElement.style.setProperty('--content-font-size', currentFontSize + 'px'); }
    decreaseFontBtn.addEventListener('click', () => { if (currentFontSize > 12) { currentFontSize -= 2; updateFontSize(); } });
    increaseFontBtn.addEventListener('click', () => { if (currentFontSize < 80) { currentFontSize += 2; updateFontSize(); } });
    updateFontSize();

    function setDarkMode(on) {
      document.body.classList.toggle('dark-mode', on);
      localStorage.setItem(LS_DARK, on ? 'true' : 'false');
    }
    darkModeToggle.addEventListener('click', () => setDarkMode(!document.body.classList.contains('dark-mode')));
    if (localStorage.getItem(LS_DARK) === 'true') setDarkMode(true);

    /* ---------- import / export manuels (secours, indépendants du gist) ---------- */
    clearBtn.addEventListener('click', () => {
      const list = getCurrentList();
      if (!list || list.tasks.length === 0) return;
      if (confirm('Vider la liste « ' + list.name + ' » ? Cette action sera aussi synchronisée.')) {
        list.tasks = [];
        mutateState();
      }
    });
    openBtn.addEventListener('click', () => { fileInput.value = ''; fileInput.click(); });
    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { loadStateFromText(reader.result); mutateState(); };
      reader.readAsText(file);
    });
    exportBtn.addEventListener('click', () => {
      const blob = new Blob([serializeLists(state.lists)], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'todo.txt';
      document.body.appendChild(a); a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
    });

    /* ---------- statut de synchro ---------- */
    function setStatus(statusState, message) {
      statusEl.className = statusState;
      const labels = { synced: 'synchronisé', pending: 'modifié', saving: 'sauvegarde…', error: 'erreur', offline: 'hors ligne', loading: 'chargement…' };
      statusLabel.textContent = message || labels[statusState] || statusState;
      statusEl.title = message || '';
    }

    /* ---------- API GitHub (gist) ---------- */
    async function ghFetch(path, opts = {}) {
      const res = await fetch('https://api.github.com' + path, {
        ...opts,
        headers: {
          'Authorization': 'token ' + ghToken,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json',
          ...(opts.headers || {})
        }
      });
      if (!res.ok) {
        let detail = '';
        try {
          const body = await res.json();
          detail = body.message || '';
          if (Array.isArray(body.errors) && body.errors.length) {
            detail += ' (' + body.errors.map(e => e.message || e.code || JSON.stringify(e)).join(', ') + ')';
          }
        } catch (e) {}
        throw new Error('GitHub API ' + res.status + (detail ? ' : ' + detail : ''));
      }
      return res.status === 204 ? null : res.json();
    }

    async function resolveGistId() {
      let id = localStorage.getItem(LS_GIST_ID);
      if (id) return id;
      for (let page = 1; page <= 5; page++) {
        const gists = await ghFetch('/gists?per_page=100&page=' + page);
        const found = gists.find(g => g.description === GIST_MARKER);
        if (found) { localStorage.setItem(LS_GIST_ID, found.id); return found.id; }
        if (gists.length < 100) break;
      }
      const created = await ghFetch('/gists', {
        method: 'POST',
        body: JSON.stringify({
          description: GIST_MARKER,
          public: false,
          files: { [GIST_FILENAME]: { content: serializeLists(state.lists) || '\n' } }
        })
      });
      localStorage.setItem(LS_GIST_ID, created.id);
      return created.id;
    }

    function showGistLink(id) {
      gistLink.innerHTML = 'Gist : <a href="https://gist.github.com/' + id + '" target="_blank" rel="noopener noreferrer">' + id + '</a>';
    }

    async function loadFromGist() {
      setStatus('loading');
      const id = await resolveGistId();
      showGistLink(id);
      const gist = await ghFetch('/gists/' + id);
      const file = gist.files[GIST_FILENAME];
      const content = file ? file.content : '';
      loadStateFromText(content === '\n' ? '' : content);
      localStorage.setItem(LS_CACHE, serializeLists(state.lists));
      render();
      setStatus('synced');
    }

    async function syncToGist() {
      setStatus('saving');
      const id = await resolveGistId();
      showGistLink(id);
      await ghFetch('/gists/' + id, {
        method: 'PATCH',
        body: JSON.stringify({ files: { [GIST_FILENAME]: { content: serializeLists(state.lists) || '\n' } } })
      });
      setStatus('synced');
    }

    let dirty = false;
    let debounceTimer = null;
    function markDirty() {
      dirty = true;
      setStatus(ghToken ? 'pending' : 'offline');
      if (!ghToken) return;
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(flushSync, DEBOUNCE_MS);
    }

    function flushSync() {
      clearTimeout(debounceTimer);
      if (!ghToken || !dirty) return;
      dirty = false;
      syncToGist().catch(err => { console.error(err); dirty = true; setStatus('error', err.message); });
    }
    // Filet de sécurité en plus du debounce : sauvegarde garantie quand
    // l'onglet passe en arrière-plan/se ferme (visibilitychange est le signal
    // fiable ; pagehide/beforeunload en secours).
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') flushSync();
    });
    window.addEventListener('pagehide', flushSync);
    window.addEventListener('beforeunload', flushSync);

    reloadBtn.addEventListener('click', () => {
      if (!ghToken) { openSettings(); return; }
      loadFromGist().catch(err => { console.error(err); setStatus('error', err.message); });
    });

    /* ---------- panneau de connexion ---------- */
    function openSettings() {
      tokenInput.value = ghToken || '';
      settingsError.style.display = 'none';
      if (localStorage.getItem(LS_GIST_ID)) showGistLink(localStorage.getItem(LS_GIST_ID));
      else gistLink.textContent = '';
      settingsModal.style.display = 'block';
      modalBackdrop.style.display = 'block';
    }
    function closeSettings() {
      settingsModal.style.display = 'none';
      modalBackdrop.style.display = 'none';
    }
    settingsBtn.addEventListener('click', openSettings);
    settingsCloseBtn.addEventListener('click', closeSettings);
    modalBackdrop.addEventListener('click', closeSettings);

    tokenSaveBtn.addEventListener('click', async () => {
      const val = tokenInput.value.trim();
      if (!val) { settingsError.textContent = 'Colle un token.'; settingsError.style.display = 'block'; return; }
      ghToken = val;
      localStorage.setItem(LS_TOKEN, ghToken);
      settingsError.style.display = 'none';
      try {
        await loadFromGist();
        closeSettings();
      } catch (err) {
        console.error(err);
        settingsError.textContent = 'Échec de connexion : ' + err.message;
        settingsError.style.display = 'block';
      }
    });

    tokenClearBtn.addEventListener('click', () => {
      ghToken = '';
      localStorage.removeItem(LS_TOKEN);
      localStorage.removeItem(LS_GIST_ID);
      tokenInput.value = '';
      gistLink.textContent = '';
      setStatus('offline');
    });

    /* ---------- démarrage ---------- */
    loadStateFromText(localStorage.getItem(LS_CACHE) || '');
    render();

    if (ghToken) {
      loadFromGist().catch(err => { console.error(err); setStatus('error', err.message); });
    } else {
      setStatus('offline');
    }
  });
  </script>
</body>
</html>
